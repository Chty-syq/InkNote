name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          tag_name="v${tauri_version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${tag_name}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Tauri version ${tauri_version}." >&2
            exit 1
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Find or create GitHub release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag_name }}
        with:
          result-encoding: string
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`Using existing release ${tag} (${release.id}).`);
              return release.id;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `InkNote ${tag}`,
              body: 'Download the Windows NSIS installer or Linux AppImage/deb package below.',
              draft: false,
              prerelease: false,
            });
            core.info(`Created release ${tag} (${release.id}).`);
            return release.id;

  release-desktop:
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/update-desktop-version.mjs --check
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          expected_tag="v${tauri_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Tauri version ${expected_tag}." >&2
            exit 1
          fi

      - name: Configure updater signing
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/configure-tauri-updater.mjs

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tagName: v__VERSION__
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: --bundles ${{ matrix.bundles }}

  publish-updater-manifest:
    needs: release-desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-tauri-updater-manifest.mjs

      - name: Verify updater manifest
        shell: bash
        run: |
          set -o pipefail
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          manifest_urls=(
            "https://github.com/${{ github.repository }}/releases/download/v${tauri_version}/latest.json"
            "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          )

          for manifest_url in "${manifest_urls[@]}"; do
            verified=false
            for attempt in {1..6}; do
              if curl --fail --location --silent --show-error "${manifest_url}" |
                jq --exit-status --arg version "${tauri_version}" '
                  .version == $version and
                  (.platforms["windows-x86_64"].signature | length > 0) and
                  (.platforms["windows-x86_64"].url | length > 0) and
                  (.platforms["linux-x86_64"].signature | length > 0) and
                  (.platforms["linux-x86_64"].url | length > 0)
                ' >/dev/null; then
                echo "Updater manifest is available: ${manifest_url}"
                verified=true
                break
              fi
              echo "Updater manifest check attempt ${attempt} failed for ${manifest_url}." >&2
              sleep 10
            done
            if [[ "${verified}" != true ]]; then
              exit 1
            fi
          done
